[package]
name = "ratatui-on-vt510"
version = "0.1.0"
edition = "2024"
description = "running ratatui on a VT510 terminal"
repository = "https://github.com/sermuns/ratatui-on-vt510"
license = "WTFPL"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.55", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
ctrlc = "3.5.1"
ratatui = "0.30.0"
serialport = "4.8.1"
thiserror = "1.0"
